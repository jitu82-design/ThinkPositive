  --bg-body: #0F1A14;
  --bg-card: #162420;
  --bg-card-border: #243D32;
  --bg-daily-shadow: rgba(0,0,0,0.4);

  --hero-g1: #142E22;
  --hero-g2: #1A3A2B;
  --hero-g3: #1F4533;
  --hero-g4: #24503B;
  --hero-circle1: rgba(140,232,184,0.06);
  --hero-circle2: rgba(140,232,184,0.04);
  --hero-subtitle: rgba(168,230,195,0.6);
  --hero-badge-bg: rgba(212,175,106,0.15);
  --hero-badge-border: rgba(212,175,106,0.25);
  --hero-badge-text: #D4AF6A;

  --gold-300: #D4AF6A;
  --gold-400: #D4AF6A;
  --gold-500: #E8CFA0;
  --gold-600: #D4AF6A;
  --gold-700: #D4AF6A;
  --gold-800: #E8CFA0;

  --mint-50: #0F1A14;
  --mint-100: #1A3A2B;
  --mint-200: #243D32;
  --mint-400: #3D6B53;

  --motiv-g1: #1A3A2B;
  --motiv-g2: #1F4533;
  --motiv-g3: #24503B;
  --motiv-text: #D4AF6A;
  --motiv-number: rgba(212,175,106,0.3);
  --motiv-circle1: rgba(140,232,184,0.08);
  --motiv-circle2: rgba(140,232,184,0.05);
  --motiv-gold-line: linear-gradient(90deg, transparent, #D4AF6A55, #D4AF6A88, #D4AF6A55, transparent);

  --filter-text: #7DD8A6;
  --filter-active-bg: linear-gradient(135deg, #1A3A2B, #24503B);
  --filter-active-text: #D4AF6A;
  --search-focus-shadow: rgba(212,175,106,0.15);

  --text-primary: #E8F0EC;
  --text-secondary: #8FA99A;
  --attr-number: #2A5040;

  --footer-g1: #122A1E;
  --footer-g2: #162E22;
  --footer-text: #7DD8A6;
  --footer-strong: #D4AF6A;

  --scrolltop-g1: #9E7D22;
  --scrolltop-g2: #7A6118;
  --scrolltop-shadow: rgba(0,0,0,0.5);

  --toggle-bg: rgba(140,232,184,0.1);
  --toggle-text: #7DD8A6;
  --toggle-hover: rgba(140,232,184,0.18);
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg-body);
  color: var(--text-primary);
  min-height: 100vh;
  transition: background 0.4s, color 0.4s;
}

/* Theme Toggle */
.theme-toggle {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 200;
  padding: 8px 16px;
  background: var(--toggle-bg);
  border: 1px solid var(--toggle-bg);
  border-radius: 30px;
  color: var(--toggle-text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s;
  backdrop-filter: blur(8px);
}
.theme-toggle:hover { background: var(--toggle-hover); }

/* Hero Section */
.hero {
  background: linear-gradient(160deg, var(--hero-g1) 0%, var(--hero-g2) 40%, var(--hero-g3) 70%, var(--hero-g4) 100%);
  padding: 80px 20px 60px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: background 0.4s;
}
.hero::before {
  content: '';
  position: absolute;
  top: -100px; right: -100px;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: var(--hero-circle1);
}
.hero::after {
  content: '';
  position: absolute;
  bottom: -80px; left: -80px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: var(--hero-circle2);
}
.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: 48px;
  font-weight: 700;
  color: var(--gold-400);
  text-shadow: 0 1px 2px rgba(0,0,0,0.15);
  margin-bottom: 12px;
  position: relative; z-index: 1;
  letter-spacing: 2px;
}
.hero p {
  font-size: 18px;
  color: var(--hero-subtitle);
  font-weight: 400;
  position: relative; z-index: 1;
}
.hero .count {
  display: inline-block;
  margin-top: 20px;
  padding: 8px 24px;
  background: var(--hero-badge-bg);
  border: 1px solid var(--hero-badge-border);
  border-radius: 30px;
  color: var(--hero-badge-text);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 1px;
  position: relative; z-index: 1;
}

/* Daily Quote Banner */
.daily-quote {
  background: var(--bg-card);
  max-width: 800px;
  margin: -30px auto 40px;
  border-radius: 16px;
  padding: 40px;
  box-shadow: 0 8px 40px var(--bg-daily-shadow);
  text-align: center;
  position: relative;
  z-index: 2;
  border: 1px solid var(--bg-card-border);
  transition: background 0.4s, border-color 0.4s;
}
.daily-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gold-500);
  margin-bottom: 16px;
}
.daily-text {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  line-height: 1.5;
  color: var(--text-primary);
  margin-bottom: 12px;
}
.daily-author {
  font-size: 14px;
  color: var(--gold-600);
  font-weight: 500;
}
.daily-btn {
  margin-top: 20px;
  padding: 10px 28px;
  background: linear-gradient(135deg, var(--scrolltop-g1), var(--scrolltop-g2));
  color: #FFFFFF;
  border: none;
  border-radius: 30px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}
.daily-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--scrolltop-shadow); filter: brightness(1.1); }

/* Filter Bar */
.filters {
  max-width: 1100px;
  margin: 0 auto 30px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
.filter-btn {
  padding: 8px 20px;
  border: 1.5px solid var(--mint-200);
  border-radius: 30px;
  background: var(--bg-card);
  color: var(--filter-text);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.25s;
  font-family: 'Inter', sans-serif;
}
.filter-btn:hover { border-color: var(--mint-400); background: var(--mint-50); }
.filter-btn.active {
  background: var(--filter-active-bg);
  color: var(--filter-active-text);
  border-color: var(--mint-400);
  font-weight: 600;
}
.search-box {
  padding: 8px 16px;
  border: 1.5px solid var(--mint-200);
  border-radius: 30px;
  font-size: 13px;
  width: 220px;
  outline: none;
  font-family: 'Inter', sans-serif;
  transition: all 0.25s;
  background: var(--bg-card);
  color: var(--text-primary);
}
.search-box::placeholder { color: var(--text-secondary); }
.search-box:focus { border-color: var(--gold-400); box-shadow: 0 0 0 3px var(--search-focus-shadow); }

/* Quote Grid */
.grid {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px 60px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.quote-card {
  border-radius: 14px;
  padding: 28px 24px;
  position: relative;
  transition: transform 0.3s, box-shadow 0.3s, background 0.4s;
  cursor: default;
  display: flex;
  flex-direction: column;
  min-height: 180px;
  overflow: hidden;
}
.quote-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 32px var(--bg-daily-shadow);
}

/* Attributed quotes */
.quote-card.attributed {
  background: var(--bg-card);
  border: 1px solid var(--bg-card-border);
  border-left: 4px solid var(--gold-400);
}
.quote-card.attributed .card-quote {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  line-height: 1.6;
  color: var(--text-primary);
  flex: 1;
}
.quote-card.attributed .card-author {
  margin-top: 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--gold-600);
}
.quote-card.attributed .card-number {
  position: absolute;
  top: 12px; right: 16px;
  font-size: 11px;
  color: var(--attr-number);
  font-weight: 500;
}

/* Motivational phrases — mint card */
.quote-card.motivational {
  background: linear-gradient(135deg, var(--motiv-g1), var(--motiv-g2), var(--motiv-g3));
  border: 1px solid var(--bg-card-border);
}
.quote-card.motivational .card-quote {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  line-height: 1.5;
  color: var(--motiv-text);
  font-weight: 600;
  text-align: center;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}
.quote-card.motivational .card-number {
  position: absolute;
  top: 12px; right: 16px;
  font-size: 11px;
  color: var(--motiv-number);
  font-weight: 500;
}
.quote-card.motivational::before {
  content: '';
  position: absolute;
  top: -20px; right: -20px;
  width: 80px; height: 80px;
  border-radius: 50%;
  background: var(--motiv-circle1);
}
.quote-card.motivational::after {
  content: '';
  position: absolute;
  bottom: -15px; left: -15px;
  width: 60px; height: 60px;
  border-radius: 50%;
  background: var(--motiv-circle2);
}
.quote-card.motivational .gold-accent {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--motiv-gold-line);
  opacity: 0.6;
}

/* Footer */
.footer {
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(135deg, var(--footer-g1), var(--footer-g2));
  color: var(--footer-text);
  font-size: 14px;
  transition: background 0.4s;
}
.footer strong {
  color: var(--footer-strong);
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  letter-spacing: 1px;
}

/* No results */
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
  font-size: 16px;
}

/* Scroll to top */
.scroll-top {
  position: fixed;
  bottom: 30px; right: 30px;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--scrolltop-g1), var(--scrolltop-g2));
  color: #FFFFFF;
  border: none;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 4px 16px var(--scrolltop-shadow);
  display: none;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  z-index: 100;
}
.scroll-top:hover { filter: brightness(1.15); transform: translateY(-2px); }

@media (max-width: 600px) {
  .hero h1 { font-size: 32px; }
  .hero { padding: 50px 16px 40px; }
  .daily-quote { margin: -20px 12px 30px; padding: 28px 20px; }
  .daily-text { font-size: 20px; }
  .grid { grid-template-columns: 1fr; padding: 0 12px 40px; }
  .filters { padding: 0 12px; }
  .search-box { width: 100%; }
  .theme-toggle { top: 12px; right: 12px; padding: 6px 12px; font-size: 12px; }
}
</style>
</head>

let currentFilter = 'all';
let searchTerm = '';

function getFiltered() {
  let list = allQuotes;
  if (currentFilter !== 'all') list = list.filter(q => q[3] === currentFilter);
  if (searchTerm) {
    const s = searchTerm.toLowerCase();
    list = list.filter(q => q[1].toLowerCase().includes(s) || q[2].toLowerCase().includes(s));
  }
  return list;
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const list = getFiltered();
  if (list.length === 0) {
    grid.innerHTML = '<div class="no-results">No quotes found. Try a different search.</div>';
    return;
  }
  grid.innerHTML = list.map(q => {
    const isMotivational = q[3] === 'Motivational Phrase';
    const cls = isMotivational ? 'motivational' : 'attributed';
    const text = isMotivational ? q[1] : '“' + q[1] + '”';
    const author = q[2] ? '<div class="card-author">— ' + q[2] + '</div>' : '';
    const goldAccent = isMotivational ? '<div class="gold-accent"></div>' : '';
    return '<div class="quote-card ' + cls + '">' +
      goldAccent +
      '<div class="card-number">#' + q[0] + '</div>' +
      '<div class="card-quote">' + text + '</div>' +
      author + '</div>';
  }).join('');
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function searchQuotes(val) {
  searchTerm = val;
  renderGrid();
}

function pickRandom() {
  return allQuotes[Math.floor(Math.random() * allQuotes.length)];
}

function renderDaily() {
  const q = pickRandom();
  document.getElementById('dailyText').textContent = q[3] === 'Quote' ? '“' + q[1] + '”' : q[1];
  document.getElementById('dailyAuthor').textContent = q[2] ? '— ' + q[2] : '';
}

function newDaily() { renderDaily(); }

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
  localStorage.setItem('theme', next);
}

// Load saved theme or default to dark
(function() {
  const saved = localStorage.getItem('theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeToggle').textContent = saved === 'dark' ? 'Light Mode' : 'Dark Mode';
  }
})();

window.addEventListener('scroll', function() {
  const btn = document.getElementById('scrollTop');
  btn.style.display = window.scrollY > 400 ? 'flex' : 'none';
});

renderDaily();
renderGrid();
</script>
